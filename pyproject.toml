[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indiek"
version = "0.9.0"
description = "A CLI package for IndieK"
requires-python = ">=3.14"
dependencies = [
    "pynacl",
    "python-dotenv",
    "pydantic",
    "networkx>=3.6.1",
    "rich>=15.0.0",
]

[project.scripts]
ik = "indiek.cli:main"

[dependency-groups]
dev = [
    "pyvis>=0.3.2",
    "ruff>=0.15.20",
    "pytest>=9.1.1",
]
