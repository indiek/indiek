[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ik"
version = "0.3.0"
description = "A minimalist CLI package for IndieK"
requires-python = ">=3.14"
dependencies = [
    "pynacl",
    "python-dotenv",
    "pydantic",
    "networkx>=3.6.1",
    "rich>=15.0.0",
]

[project.scripts]
ik = "ik.cli:main"

[dependency-groups]
dev = [
    "pyvis>=0.3.2",
]
