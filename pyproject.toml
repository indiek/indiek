[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indiek"
version = "1.0.0"
description = "IndieK archive SDK and ik CLI"
requires-python = ">=3.14"
dependencies = [
    "pynacl",
    "pydantic",
]
readme = "README.md"

[project.optional-dependencies]
cli = [
    "python-dotenv",
    "rich>=15.0.0",
]
viz = [
    "networkx>=3.6.1",
    "pyvis>=0.3.2",
]

[project.scripts]
ik = "indiek.cli:main"

[dependency-groups]
dev = [
    "indiek[cli]",
    "ruff>=0.15.20",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running tests, run with `uv run pytest -m slow`"]
addopts = "-m 'not slow'"
